{% extends "base.html" %}
{% block content %}
<h2>Login</h2>
{% if message %}
<p class="message">{{ message }}</p>
{% endif %}
<form method="post" action="/login">
Username
<input type="text" name="username">
Password
<input type="password" name="password">
<button type="submit">Login</button>
</form>
<p>No account yet? <a href="/register">Register here</a></p>
{% endblock %}
