{% extends "base.html" %}
{% block content %}
<h2>Leaderboard</h2>
{% if rows %}
<table>
<tr>
<th>Rank</th>
<th>Name</th>
<th>Score</th>
<th>Time (seconds)</th>
</tr>
{% for r in rows %}
<tr>
<td>{{ loop.index }}</td>
<td>{{ r.username }}</td>
<td>{{ r.score }}</td>
<td>{{ r.seconds }}</td>
</tr>
{% endfor %}
</table>
{% else %}
<p>Nobody has finished the exam yet.</p>
{% endif %}
{% endblock %}
